x-php: &php
  image: thumugiiro-php
  build:
    context: .
    dockerfile: infra/php/Dockerfile
  working_dir: /var/www/html/scr
  volumes:
    - .:/var/www/html
  networks:
    - app-network
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *php
    restart: unless-stopped

  scheduler:
    <<: *php
    command: cron -f
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: db_thumugiiro
    environment:
      MYSQL_DATABASE: db_thumugiiro
      MYSQL_USER: user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
      TZ: Asia/Tokyo
    ports:
      - "8081:80"
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit
    container_name: mailpit_thumugiiro
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-network

volumes:
  dbdata:

networks:
  app-network:
    driver: bridge
